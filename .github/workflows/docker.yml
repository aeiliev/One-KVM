name: Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: false
        default: latest
      platforms:
        description: Docker platforms
        required: false
        default: linux/amd64,linux/arm64,linux/arm/v7
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required to push to ghcr.io with the built-in GITHUB_TOKEN.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64,linux/arm64,linux/arm/v7' }}
  DOCKER_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # Empty when the optional Docker Hub secrets are not configured.
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Reuse dependency artifacts produced by the deb job and vice versa.
          shared-key: linux-cross-release
          key: ${{ hashFiles('Cross.toml', 'build/cross/Dockerfile.*') }}
          cache-all-crates: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xz-utils
          cargo install cross --version 0.2.5 --locked

      - name: Build frontend
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux binaries
        run: bash build/build-images.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Container Registry
        run: |
          # ghcr.io requires a lowercase namespace.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ./build/package-docker.sh --platform "$DOCKER_PLATFORMS" --registry "ghcr.io/$owner" --tag "$DOCKER_TAG" --push
          ./build/package-docker.sh --platform "$DOCKER_PLATFORMS" --registry "ghcr.io/$owner" --variant full --tag "$DOCKER_TAG" --push

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          ./build/package-docker.sh --platform "$DOCKER_PLATFORMS" --registry "docker.io/$DOCKERHUB_USERNAME" --tag "$DOCKER_TAG" --push
          ./build/package-docker.sh --platform "$DOCKER_PLATFORMS" --registry "docker.io/$DOCKERHUB_USERNAME" --variant full --tag "$DOCKER_TAG" --push
